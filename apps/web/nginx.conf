# O esquema do browser: o de um proxy TLS à frente deste nginx, se houver; senão, o deste pedido
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Ficheiros com hash no nome (gerados pelo Vite): podem ficar em cache para sempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O servidor (Spring Boot): a API, a entrada pelo fornecedor de identidade e o fim de sessão. O
    # servidor constrói com estes cabeçalhos o endereço de regresso do browser. O X-Forwarded-Host vai
    # com a porta: só com o X-Forwarded-Proto, o servidor esquecia a porta que vem no Host.
    # DEFIRO_SERVER é substituído no arranque (imagem nginx, /etc/nginx/templates).
    location ~ ^/(api|oauth2|login/oauth2|logout)(/|$) {
        proxy_pass ${DEFIRO_SERVER};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # As rotas são da app (React Router): qualquer caminho desconhecido devolve o index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
