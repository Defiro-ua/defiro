spring.application.name=defiro

# The server is only reached through the proxy (nginx, or Vite in development), which says in these
# headers which address the browser is on. Not native: Tomcat drops the port without X-Forwarded-Port.
server.forward-headers-strategy=framework
# Lax and not Strict: coming back from the identity provider's page is a navigation from another site,
# and the session has to be there. Secure follows the scheme the browser is on.
server.servlet.session.cookie.same-site=lax

spring.datasource.url=jdbc:postgresql://localhost:5432/defiro
spring.datasource.username=defiro
spring.datasource.password=defiro
# One schema per store: Identity, Designer, Engine and Registry store.
spring.flyway.schemas=identity,designer,engine,registry
spring.flyway.default-schema=public

# Only packages annotated with @ApplicationModule are modules. Without this,
# the spec and plugin-sdk packages (io.github.defiro.spec, .plugin) count too.
spring.modulith.detection-strategy=explicitly-annotated
