spring.application.name=defiro

spring.datasource.url=jdbc:postgresql://localhost:5432/defiro
spring.datasource.username=defiro
spring.datasource.password=defiro
# One schema per store: Designer, Engine and Registry store. Identity owns no data.
spring.flyway.schemas=designer,engine,registry
spring.flyway.default-schema=public

# Only packages annotated with @ApplicationModule are modules. Without this,
# the spec and plugin-sdk packages (io.github.defiro.spec, .plugin) count too.
spring.modulith.detection-strategy=explicitly-annotated

# The organization's groups and units, which the designer offers for who can request and who
# handles each step (UC05). As agreed for #29, they are listed here until defiro reads them from
# Entra ID through Microsoft Graph. Each has a name and a kind: group or unit.
# Spring Boot reads this file as ISO-8859-1: letters outside it are written as \u escapes.
defiro.directory.groups[0].name=Chefias
defiro.directory.groups[0].kind=group
defiro.directory.groups[1].name=Divis\u00e3o de Obras Municipais
defiro.directory.groups[1].kind=unit
defiro.directory.groups[2].name=Divis\u00e3o Financeira
defiro.directory.groups[2].kind=unit
defiro.directory.groups[3].name=Recursos Humanos
defiro.directory.groups[3].kind=unit
defiro.directory.groups[4].name=RH \u00b7 Forma\u00e7\u00e3o
defiro.directory.groups[4].kind=group
