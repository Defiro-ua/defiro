# Development only: the Keycloak of deploy/compose.yaml and its people. Outside it, the registration
# comes from the environment (README).
spring.flyway.locations=classpath:db/migration,classpath:db/dev

spring.security.oauth2.client.registration.oidc.client-id=defiro
spring.security.oauth2.client.registration.oidc.client-secret=defiro-dev-only
spring.security.oauth2.client.registration.oidc.scope=openid,profile,email
spring.security.oauth2.client.provider.oidc.issuer-uri=http://localhost:8081/realms/defiro
