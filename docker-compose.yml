# defiro: cada parte da aplicação no seu container.
#
#   docker compose up --build                      frontend em http://localhost:8080
#   docker compose --profile dev up frontend-dev   frontend com recarregamento automático em http://localhost:5173
#
# O backend e a base de dados entram aqui como novos serviços quando existirem.

services:
  frontend:
    build: ./frontend
    image: defiro-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

  # Desenvolvimento: o código de ./frontend é montado no container e o Vite recarrega a página a cada alteração
  frontend-dev:
    profiles: [dev]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # node_modules fica no container, separado do da máquina
      - frontend-node-modules:/app/node_modules
    environment:
      # Em sistemas de ficheiros montados (Windows, macOS) o Vite precisa de sondar alterações
      CHOKIDAR_USEPOLLING: "true"

volumes:
  frontend-node-modules:
