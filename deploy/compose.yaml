services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: defiro
      POSTGRES_USER: defiro
      POSTGRES_PASSWORD: defiro
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defiro"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Who signs in, in development: the realm is imported each time the container is created.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # One address for the browser and the server: it goes in every token's iss, which is compared as text.
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["./keycloak/defiro-realm.json:/opt/keycloak/data/import/defiro-realm.json:ro"]
    healthcheck:
      # The image has no curl
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The web app, built and served by nginx. Port 3000, so it doesn't clash with the server on 8080.
  web:
    build: ../apps/web
    image: defiro-web
    ports: ["${WEB_PORT:-3000}:80"]
    restart: unless-stopped
    environment:
      DEFIRO_SERVER: ${DEFIRO_SERVER:-http://host.docker.internal:8080}
    # The server runs on the host (./mvnw spring-boot:run); on Linux this name needs to be added
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      keycloak: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # The web app with live reload, without installing Node: docker compose -f deploy/compose.yaml --profile dev up web-dev
  web-dev:
    profiles: [dev]
    image: node:26-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports: ["${WEB_DEV_PORT:-5173}:5173"]
    volumes:
      - ../apps/web:/app
      # node_modules stays in the container, apart from the host's
      - web-node-modules:/app/node_modules
    environment:
      # Mounted folders on Windows and macOS need polling for Vite to notice changes
      CHOKIDAR_USEPOLLING: "true"
      # The server, on the host
      DEFIRO_SERVER: ${DEFIRO_SERVER:-http://host.docker.internal:8080}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      keycloak: { condition: service_healthy }
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  web-node-modules:
